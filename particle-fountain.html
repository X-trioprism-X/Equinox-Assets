<!DOCTYPE html>
<html lang="en"><head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Petal Fall</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:100%;height:100%;overflow:hidden;background:#020617}
canvas{display:block;width:100%;height:100%}
</style></head>
<body><canvas id="c"></canvas>
<script>
const c=document.getElementById('c'),x=c.getContext('2d');
function resize(){c.width=innerWidth;c.height=innerHeight}
addEventListener('resize',resize);resize();

let petals=Array.from({length:40},()=>({x:Math.random()*c.width,y:Math.random()*c.height,r:4+Math.random()*6,vy:0.5+Math.random(),rot:Math.random()*6,vr:0.02+Math.random()*0.03,h:320+Math.random()*40}));
function draw(){x.fillStyle='rgba(15,10,20,0.12)';x.fillRect(0,0,c.width,c.height);
petals.forEach(p=>{p.y+=p.vy;p.x+=Math.sin(p.y*0.02)*0.8;p.rot+=p.vr;if(p.y>c.height){p.y=-10;p.x=Math.random()*c.width}
x.save();x.translate(p.x,p.y);x.rotate(p.rot);x.fillStyle=`hsla(${p.h},60%,70%,0.6)`;x.beginPath();x.ellipse(0,0,p.r,p.r*0.5,0,0,7);x.fill();x.restore()});
requestAnimationFrame(draw)}draw();
</script></body></html>
