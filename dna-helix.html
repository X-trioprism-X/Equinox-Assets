<!DOCTYPE html>
<html lang="en"><head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>DNA Helix</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:100%;height:100%;overflow:hidden;background:#020617}
canvas{display:block;width:100%;height:100%}
</style></head>
<body><canvas id="c"></canvas>
<script>
const c=document.getElementById('c'),x=c.getContext('2d');
function resize(){c.width=innerWidth;c.height=innerHeight}
addEventListener('resize',resize);resize();

let t=0;function draw(){t+=0.04;x.fillStyle='rgba(2,6,23,0.2)';x.fillRect(0,0,c.width,c.height);
const cx=c.width/2;
for(let i=0;i<40;i++){const y=i*(c.height/40);const o=Math.sin(t+i*0.3)*60;
x.beginPath();x.arc(cx+o,y,4,0,7);x.fillStyle='#38bdf8';x.fill();
x.beginPath();x.arc(cx-o,y,4,0,7);x.fillStyle='#a855f7';x.fill();
if(i%3===0){x.strokeStyle='rgba(255,255,255,0.15)';x.beginPath();x.moveTo(cx+o,y);x.lineTo(cx-o,y);x.stroke()}}
requestAnimationFrame(draw)}draw();
</script></body></html>
