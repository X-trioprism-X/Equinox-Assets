<!DOCTYPE html>
<html lang="en"><head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Portal Rings</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:100%;height:100%;overflow:hidden;background:#020617}
canvas{display:block;width:100%;height:100%}
</style></head>
<body><canvas id="c"></canvas>
<script>
const c=document.getElementById('c'),x=c.getContext('2d');
function resize(){c.width=innerWidth;c.height=innerHeight}
addEventListener('resize',resize);resize();

let t=0;function draw(){t+=0.04;x.fillStyle='rgba(2,6,23,0.2)';x.fillRect(0,0,c.width,c.height);
const cx=c.width/2,cy=c.height/2;
for(let i=0;i<10;i++){const r=20+i*25+Math.sin(t+i)*8;x.strokeStyle=`hsla(${270+i*8},80%,55%,${0.6-i*0.05})`;x.lineWidth=2;
x.beginPath();x.arc(cx,cy,r,t+i,t+i+Math.PI*1.5);x.stroke()}
requestAnimationFrame(draw)}draw();
</script></body></html>
