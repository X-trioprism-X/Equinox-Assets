<!DOCTYPE html>
<html lang="en"><head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Geometry Storm</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:100%;height:100%;overflow:hidden;background:#020617}
canvas{display:block;width:100%;height:100%}
</style></head>
<body><canvas id="c"></canvas>
<script>
const c=document.getElementById('c'),x=c.getContext('2d');
function resize(){c.width=innerWidth;c.height=innerHeight}
addEventListener('resize',resize);resize();

let shapes=Array.from({length:18},()=>({x:Math.random()*c.width,y:Math.random()*c.height,s:10+Math.random()*30,sides:3+Math.floor(Math.random()*4),rot:0,vr:(Math.random()-0.5)*0.04,vx:(Math.random()-0.5)*1,vy:(Math.random()-0.5)*1,h:Math.random()*360}));
function draw(){x.fillStyle='rgba(2,6,23,0.12)';x.fillRect(0,0,c.width,c.height);
shapes.forEach(s=>{s.x+=s.vx;s.y+=s.vy;s.rot+=s.vr;if(s.x<-40||s.x>c.width+40)s.vx*=-1;if(s.y<-40||s.y>c.height+40)s.vy*=-1;
x.save();x.translate(s.x,s.y);x.rotate(s.rot);x.strokeStyle=`hsla(${s.h},70%,55%,0.45)`;x.lineWidth=1.5;x.beginPath();
for(let i=0;i<s.sides;i++){const a=Math.PI*2*i/s.sides;const px=Math.cos(a)*s.s,py=Math.sin(a)*s.s;i?x.lineTo(px,py):x.moveTo(px,py)}
x.closePath();x.stroke();x.restore()});requestAnimationFrame(draw)}draw();
</script></body></html>
