<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Loading Equinox...</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: #020617;
            color: white;
            font-family: system-ui, -apple-system, sans-serif;
            height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 20px;
        }
        .loader {
            width: 48px;
            height: 48px;
            border: 4px solid rgba(168, 85, 247, 0.2);
            border-top-color: #a855f7;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
        .status {
            font-size: 1.1rem;
            opacity: 0.8;
        }
        .error {
            color: #f87171;
            max-width: 400px;
            text-align: center;
            line-height: 1.5;
            display: none;
        }
        button {
            margin-top: 12px;
            padding: 10px 24px;
            background: #a855f7;
            color: white;
            border: none;
            border-radius: 9999px;
            font-weight: 600;
            cursor: pointer;
        }
        button:hover { background: #9333ea; }
    </style>
</head>
<body>
    <div class="loader" id="loader"></div>
    <div class="status" id="status">Fetching latest version from GitHub...</div>
    <div class="error" id="error"></div>
    <button id="retryBtn" style="display:none" onclick="loadLatest()">Retry</button>

<script>
    // Prefer jsDelivr (faster), fall back to raw GitHub
    const SOURCES = [
        "https://cdn.jsdelivr.net/gh/X-trioprism-X/Equinox-Assets@main/index.html",
        "https://raw.githubusercontent.com/X-trioprism-X/Equinox-Assets/main/index.html"
    ];

    async function loadLatest() {
        const loader = document.getElementById('loader');
        const status = document.getElementById('status');
        const errorBox = document.getElementById('error');
        const retryBtn = document.getElementById('retryBtn');

        loader.style.display = 'block';
        status.style.display = 'block';
        errorBox.style.display = 'none';
        retryBtn.style.display = 'none';
        status.textContent = "Fetching latest version from GitHub...";

        let lastError = null;

        for (const url of SOURCES) {
            try {
                status.textContent = `Trying ${url.includes('jsdelivr') ? 'jsDelivr' : 'GitHub Raw'}...`;

                const response = await fetch(url + "?t=" + Date.now(), {
                    cache: "no-store"
                });

                if (!response.ok) {
                    throw new Error(`HTTP ${response.status}`);
                }

                const html = await response.text();

                if (!html || html.length < 500) {
                    throw new Error("Received empty or invalid HTML");
                }

                // Fully replace the current page with the remote index.html
                document.open();
                document.write(html);
                document.close();
                return; // success

            } catch (err) {
                lastError = err;
                console.warn(`Failed to load from ${url}:`, err);
            }
        }

        // Both sources failed
        loader.style.display = 'none';
        status.style.display = 'none';
        errorBox.style.display = 'block';
        retryBtn.style.display = 'inline-block';
        errorBox.innerHTML = `
            Failed to load the latest version.<br><br>
            <small>${lastError?.message || "Unknown error"}</small><br><br>
            Make sure you have an internet connection and the repo is public.
        `;
    }

    // Start loading as soon as the page opens
    loadLatest();
</script>
</body>
</html>
