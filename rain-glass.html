<!DOCTYPE html>
<html lang="en"><head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Ripple Pond</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:100%;height:100%;overflow:hidden;background:#020617}
canvas{display:block;width:100%;height:100%}
</style></head>
<body><canvas id="c"></canvas>
<script>
const c=document.getElementById('c'),x=c.getContext('2d');
function resize(){c.width=innerWidth;c.height=innerHeight}
addEventListener('resize',resize);resize();

let ripples=[],t=0;
setInterval(()=>ripples.push({x:Math.random()*c.width,y:Math.random()*c.height,r:0,max:80+Math.random()*100}),600);
function draw(){t++;x.fillStyle='rgba(2,6,23,0.12)';x.fillRect(0,0,c.width,c.height);
ripples=ripples.filter(r=>{r.r+=1.2;if(r.r>r.max)return false;
x.strokeStyle=`rgba(56,189,248,${1-r.r/r.max})`;x.lineWidth=2;x.beginPath();x.arc(r.x,r.y,r.r,0,7);x.stroke();return true});
requestAnimationFrame(draw)}draw();
</script></body></html>
