<!DOCTYPE html>
<html lang="en"><head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Pixel Storm</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:100%;height:100%;overflow:hidden;background:#020617}
canvas{display:block;width:100%;height:100%}
</style></head>
<body><canvas id="c"></canvas>
<script>
const c=document.getElementById('c'),x=c.getContext('2d');
function resize(){c.width=innerWidth;c.height=innerHeight}
addEventListener('resize',resize);resize();

let px=Array.from({length:60},()=>({x:Math.random()*c.width,y:Math.random()*-c.height,vy:1+Math.random()*3,s:4+Math.random()*8,h:Math.random()*360}));
function draw(){x.fillStyle='rgba(2,6,23,0.15)';x.fillRect(0,0,c.width,c.height);
px.forEach(p=>{p.y+=p.vy;if(p.y>c.height){p.y=-10;p.x=Math.random()*c.width}
x.fillStyle=`hsla(${p.h},80%,55%,0.7)`;x.fillRect(p.x,p.y,p.s,p.s)});requestAnimationFrame(draw)}draw();
</script></body></html>
