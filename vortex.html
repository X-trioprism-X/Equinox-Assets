<!DOCTYPE html>
<html lang="en"><head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Wave Bars</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:100%;height:100%;overflow:hidden;background:#020617}
canvas{display:block;width:100%;height:100%}
</style></head>
<body><canvas id="c"></canvas>
<script>
const c=document.getElementById('c'),x=c.getContext('2d');
function resize(){c.width=innerWidth;c.height=innerHeight}
addEventListener('resize',resize);resize();

let t=0;function draw(){t+=0.08;x.fillStyle='#020617';x.fillRect(0,0,c.width,c.height);
const n=32,w=c.width/n;
for(let i=0;i<n;i++){const h=(Math.sin(t+i*0.4)*0.5+0.5)*c.height*0.5;
x.fillStyle=`hsla(${260+i*3},70%,55%,0.7)`;x.fillRect(i*w+2,c.height/2-h/2,w-4,h)}
requestAnimationFrame(draw)}draw();
</script></body></html>
