<!DOCTYPE html>
<html lang="en"><head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Particle Fountain</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:100%;height:100%;overflow:hidden;background:#020617}
canvas{display:block;width:100%;height:100%}
</style></head>
<body><canvas id="c"></canvas>
<script>
const c=document.getElementById('c'),x=c.getContext('2d');
function resize(){c.width=innerWidth;c.height=innerHeight}
addEventListener('resize',resize);resize();

let parts=[];
function spawn(){parts.push({x:c.width/2+(Math.random()-0.5)*30,y:c.height,vx:(Math.random()-0.5)*2,vy:-(Math.random()*6+4),life:1,h:Math.random()*60+260})}
function draw(){
  x.fillStyle='rgba(2,6,23,0.15)';x.fillRect(0,0,c.width,c.height);
  if(parts.length<120)spawn();
  parts=parts.filter(p=>{
    p.x+=p.vx;p.y+=p.vy;p.vy+=0.08;p.life-=0.008;
    if(p.life<=0)return false;
    x.beginPath();x.arc(p.x,p.y,p.life*3,0,7);
    x.fillStyle=`hsla(${p.h},80%,60%,${p.life})`;x.fill();return true;
  });
  requestAnimationFrame(draw)
}draw();

</script></body></html>
