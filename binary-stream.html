<!DOCTYPE html>
<html lang="en"><head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Binary Stream</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:100%;height:100%;overflow:hidden;background:#020617}
canvas{display:block;width:100%;height:100%}
</style></head>
<body><canvas id="c"></canvas>
<script>
const c=document.getElementById('c'),x=c.getContext('2d');
function resize(){c.width=innerWidth;c.height=innerHeight}
addEventListener('resize',resize);resize();

let cols=Array.from({length:Math.floor(c.width/14)},()=>({y:Math.random()*c.height,speed:1+Math.random()*2}));
function draw(){x.fillStyle='rgba(2,6,23,0.08)';x.fillRect(0,0,c.width,c.height);x.font='12px monospace';x.fillStyle='#22c55e';
cols.forEach((col,i)=>{col.y+=col.speed;if(col.y>c.height)col.y=0;
x.fillText(Math.random()>0.5?'1':'0',i*14,col.y)});requestAnimationFrame(draw)}draw();
</script></body></html>
