<!DOCTYPE html>
<html lang="en"><head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Cyber Tunnel</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:100%;height:100%;overflow:hidden;background:#020617}
canvas{display:block;width:100%;height:100%}
</style></head>
<body><canvas id="c"></canvas>
<script>
const c=document.getElementById('c'),x=c.getContext('2d');
function resize(){c.width=innerWidth;c.height=innerHeight}
addEventListener('resize',resize);resize();

let t=0;function draw(){t+=0.03;x.fillStyle='rgba(2,6,23,0.2)';x.fillRect(0,0,c.width,c.height);
for(let i=0;i<12;i++){const z=((t*40+i*30)%300);const s=z*2;const a=1-z/300;
x.strokeStyle=`rgba(168,85,247,${a*0.6})`;x.lineWidth=2;
x.strokeRect(c.width/2-s/2,c.height/2-s/2,s,s)}requestAnimationFrame(draw)}draw();
</script></body></html>
