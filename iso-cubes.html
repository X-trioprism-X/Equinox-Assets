<!DOCTYPE html>
<html lang="en"><head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Isometric Cubes</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:100%;height:100%;overflow:hidden;background:#020617}
canvas{display:block;width:100%;height:100%}
</style></head>
<body><canvas id="c"></canvas>
<script>
const c=document.getElementById('c'),x=c.getContext('2d');
function resize(){c.width=innerWidth;c.height=innerHeight}
addEventListener('resize',resize);resize();

let cubes=Array.from({length:15},()=>({x:Math.random()*c.width,y:Math.random()*c.height,s:15+Math.random()*25,vy:-(0.2+Math.random()*0.5),rot:Math.random()*6}));
function draw(){x.fillStyle='rgba(2,6,23,0.12)';x.fillRect(0,0,c.width,c.height);
cubes.forEach(cu=>{cu.y+=cu.vy;cu.rot+=0.01;if(cu.y<-40){cu.y=c.height+20;cu.x=Math.random()*c.width}
x.save();x.translate(cu.x,cu.y);x.strokeStyle='rgba(168,85,247,0.5)';x.lineWidth=1.5;
const s=cu.s;x.beginPath();x.moveTo(0,-s);x.lineTo(s*0.87,-s*0.5);x.lineTo(s*0.87,s*0.5);x.lineTo(0,s);x.lineTo(-s*0.87,s*0.5);x.lineTo(-s*0.87,-s*0.5);x.closePath();x.stroke();
x.beginPath();x.moveTo(0,-s);x.lineTo(0,0);x.lineTo(s*0.87,-s*0.5);x.moveTo(0,0);x.lineTo(-s*0.87,-s*0.5);x.stroke();x.restore()});
requestAnimationFrame(draw)}draw();
</script></body></html>
