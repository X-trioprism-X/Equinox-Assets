<!DOCTYPE html>
<html lang="en"><head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Matrix Rain</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:100%;height:100%;overflow:hidden;background:#020617}
canvas{display:block;width:100%;height:100%}
</style></head>
<body><canvas id="c"></canvas>
<script>
const c=document.getElementById('c'),x=c.getContext('2d');
function resize(){c.width=innerWidth;c.height=innerHeight}
addEventListener('resize',resize);resize();

const cols=Math.floor(c.width/16);const drops=Array(cols).fill(1);
const chars='アイウエオカキクケコｱｲｳｴｵ01';
function draw(){
  x.fillStyle='rgba(2,6,23,0.08)';x.fillRect(0,0,c.width,c.height);
  x.fillStyle='#22c55e';x.font='14px monospace';
  drops.forEach((y,i)=>{const t=chars[Math.floor(Math.random()*chars.length)];x.fillText(t,i*16,y*16);
    if(y*16>c.height&&Math.random()>0.975)drops[i]=0;drops[i]++});
  requestAnimationFrame(draw)
}draw();

</script></body></html>
