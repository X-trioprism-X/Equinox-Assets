<!DOCTYPE html>
<html lang="en"><head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Vortex Spiral</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:100%;height:100%;overflow:hidden;background:#020617}
canvas{display:block;width:100%;height:100%}
</style></head>
<body><canvas id="c"></canvas>
<script>
const c=document.getElementById('c'),x=c.getContext('2d');
function resize(){c.width=innerWidth;c.height=innerHeight}
addEventListener('resize',resize);resize();

let t=0;function draw(){t+=0.03;x.fillStyle='rgba(2,6,23,0.15)';x.fillRect(0,0,c.width,c.height);
const cx=c.width/2,cy=c.height/2;
for(let i=0;i<120;i++){const a=t+i*0.2;const r=i*2.5;const px=cx+Math.cos(a)*r;const py=cy+Math.sin(a)*r;
x.beginPath();x.arc(px,py,2,0,7);x.fillStyle=`hsla(${270+i},70%,55%,${1-i/120})`;x.fill()}
requestAnimationFrame(draw)}draw();
</script></body></html>
