<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Particle Background</title>
    <style>
        :root {
            --primary: #a855f7;
            --primary-hue: 265;
            --bg: #020617;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: var(--bg);
            min-height: 100vh;
            overflow: hidden;
            font-family: system-ui, -apple-system, sans-serif;
            color: #fff;
        }

        #particle-canvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -1;
            pointer-events: none;
            opacity: 0.9;
        }

        /* Simple control panel (optional – remove if you only want the background) */
        .controls {
            position: fixed;
            bottom: 24px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            align-items: center;
            gap: 16px;
            background: rgba(30, 41, 59, 0.7);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.12);
            border-radius: 9999px;
            padding: 12px 20px;
            z-index: 10;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.4);
        }

        .controls label {
            font-size: 0.85rem;
            opacity: 0.85;
            white-space: nowrap;
        }

        .controls input[type="color"] {
            width: 36px;
            height: 36px;
            border: none;
            border-radius: 50%;
            cursor: pointer;
            background: transparent;
            padding: 0;
        }

        .controls input[type="color"]::-webkit-color-swatch-wrapper {
            padding: 0;
        }

        .controls input[type="color"]::-webkit-color-swatch {
            border: 2px solid rgba(255, 255, 255, 0.4);
            border-radius: 50%;
        }

        .toggle-btn {
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.15);
            color: #fff;
            padding: 8px 16px;
            border-radius: 9999px;
            cursor: pointer;
            font-size: 0.85rem;
            transition: all 0.2s;
        }

        .toggle-btn:hover {
            background: rgba(255, 255, 255, 0.18);
        }

        .toggle-btn.on {
            background: var(--primary);
            color: #000;
            border-color: var(--primary);
            font-weight: 600;
        }
    </style>
</head>
<body>
    <canvas id="particle-canvas"></canvas>


   
    <script>
        // ── Config ──────────────────────────────────────────────
        let particlesEnabled = true;
        let primaryHue = 265;

        // ── Canvas setup ────────────────────────────────────────
        const canvas = document.getElementById('particle-canvas');
        const ctx = canvas.getContext('2d');
        let particles = [];

        // ── Particle class (theme-reactive) ─────────────────────
        class Particle {
            constructor() {
                this.reset();
            }

            reset() {
                this.x = Math.random() * canvas.width;
                this.y = Math.random() * canvas.height;
                this.size = Math.random() * 3.5 + 1.2;
                this.speedY = Math.random() * 1.3 + 0.7;
                this.speedX = Math.random() * 0.8 - 0.4;
                this.hue = primaryHue;
                this.opacity = Math.random() * 0.75 + 0.45;
                this.life = 1;
            }

            update() {
                this.y -= this.speedY;
                this.x += this.speedX;
                this.life -= 0.0035;
                if (this.y < 0 || this.life <= 0) this.reset();
            }

            draw() {
                ctx.save();
                ctx.globalAlpha = this.opacity * this.life;
                ctx.fillStyle = `hsl(${this.hue}, 95%, 78%)`;
                ctx.shadowBlur = 15;
                ctx.shadowColor = `hsl(${this.hue}, 100%, 65%)`;
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
                ctx.fill();
                // second pass for stronger glow
                ctx.shadowBlur = 28;
                ctx.fill();
                ctx.restore();
            }
        }

        function initParticles(count = 130) {
            particles = [];
            for (let i = 0; i < count; i++) {
                particles.push(new Particle());
            }
        }

        function drawConnections() {
            ctx.strokeStyle = `hsla(${primaryHue}, 95%, 60%, 0.15)`;
            ctx.lineWidth = 1.1;
            for (let i = 0; i < particles.length; i++) {
                for (let j = i + 1; j < particles.length; j++) {
                    const dx = particles[i].x - particles[j].x;
                    const dy = particles[i].y - particles[j].y;
                    const distance = Math.hypot(dx, dy);
                    if (distance < 145) {
                        ctx.globalAlpha = (1 - distance / 145) * 0.28;
                        ctx.beginPath();
                        ctx.moveTo(particles[i].x, particles[i].y);
                        ctx.lineTo(particles[j].x, particles[j].y);
                        ctx.stroke();
                    }
                }
            }
            ctx.globalAlpha = 1;
        }

        function animateParticles() {
            if (!particlesEnabled) {
                ctx.clearRect(0, 0, canvas.width, canvas.height);
                requestAnimationFrame(animateParticles);
                return;
            }

            // trail / fade effect
            ctx.fillStyle = 'rgba(2, 6, 23, 0.13)';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            particles.forEach(p => {
                p.update();
                p.draw();
            });
            drawConnections();
            requestAnimationFrame(animateParticles);
        }

        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
            initParticles(130);
        }

        // ── Controls ────────────────────────────────────────────
        function toggleParticles() {
            particlesEnabled = !particlesEnabled;
            const btn = document.getElementById('partToggle');
            btn.textContent = particlesEnabled ? 'Particles ON' : 'Particles OFF';
            btn.classList.toggle('on', particlesEnabled);
        }

        function hexToHue(hex) {
            // convert #rrggbb → approximate hue (0–360)
            const r = parseInt(hex.slice(1, 3), 16) / 255;
            const g = parseInt(hex.slice(3, 5), 16) / 255;
            const b = parseInt(hex.slice(5, 7), 16) / 255;
            const max = Math.max(r, g, b);
            const min = Math.min(r, g, b);
            const d = max - min;
            let h = 0;
            if (d !== 0) {
                if (max === r) h = ((g - b) / d) % 6;
                else if (max === g) h = (b - r) / d + 2;
                else h = (r - g) / d + 4;
                h *= 60;
                if (h < 0) h += 360;
            }
            return Math.round(h);
        }

        document.getElementById('colorPicker').addEventListener('input', (e) => {
            const color = e.target.value;
            document.documentElement.style.setProperty('--primary', color);
            primaryHue = hexToHue(color);
            // update existing particles so they pick up the new hue on next reset
            particles.forEach(p => { p.hue = primaryHue; });
        });

        // ── Start ───────────────────────────────────────────────
        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();
        animateParticles();
    </script>
</body>
</html>
