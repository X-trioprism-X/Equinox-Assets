<!DOCTYPE html>
<html lang="en"><head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Spatial Networking</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:100%;height:100%;overflow:hidden;background:#020617}
canvas{display:block;width:100%;height:100%}

</style></head>
<body><canvas id="c"></canvas>

<script>
(function(){
  function dens(){
    try {
      const d = parseInt(localStorage.getItem('backdrop_particle_density') || '60', 10);
      return Math.max(10, Math.min(200, isNaN(d) ? 60 : d));
    } catch(e){ return 60; }
  }
  window.__bgDensity = dens;
  window.addEventListener('storage', function(e){
    if(e.key === 'backdrop_particle_density') window.__bgDensity = dens;
  });
  window.addEventListener('message', function(e){
    if(e.data && e.data.type === 'setDensity') {
      try { localStorage.setItem('backdrop_particle_density', String(e.data.value)); } catch(x){}
      window.__bgDensity = dens;
      if(typeof window.__onDensityChange === 'function') window.__onDensityChange();
    }
  });
})();
</script>

<script>

const canvas=document.getElementById('c'),ctx=canvas.getContext('2d');
let W,H,pts=[],t=0;
const SEED=42, HUE0=265, MODE='net';
function resize(){W=canvas.width=innerWidth;H=canvas.height=innerHeight;init();}
function count(){const d=window.__bgDensity?window.__bgDensity():60;return Math.floor(d*1.8);}
function init(){
  const n=count();
  pts=[];
  for(let i=0;i<n;i++){
    pts.push({
      x:Math.random()*W,y:Math.random()*H,
      vx:(Math.random()-0.5)*0.45,vy:(Math.random()-0.5)*0.45,
      r:1.2+Math.random()*2.2, life:Math.random()
    });
  }
}
window.__onDensityChange=init;
function draw(){
  t+=0.008;
  ctx.fillStyle='rgba(2,6,23,0.14)';
  ctx.fillRect(0,0,W,H);
  const n=pts.length;
  for(let i=0;i<n;i++){
    const p=pts[i];
    if(MODE==='rain'){p.y+=1.2+p.r;p.x+=p.vx;if(p.y>H){p.y=0;p.x=Math.random()*W;}}
    else if(MODE==='rise'){p.y-=0.6+p.r*0.3;p.x+=Math.sin(t+p.life)*0.3;if(p.y<0){p.y=H;p.x=Math.random()*W;}}
    else if(MODE==='orbit'){
      const cx=W/2,cy=H/2;const ang=t*0.3+p.life*6.28;const rad=80+p.life*Math.min(W,H)*0.35;
      p.x=cx+Math.cos(ang)*rad;p.y=cy+Math.sin(ang*0.9)*rad*0.65;
    } else if(MODE==='spiral'){
      const cx=W/2,cy=H/2;const ang=t*0.5+i*0.15;const rad=(40+i%40)*2+Math.sin(t+i)*10;
      p.x=cx+Math.cos(ang)*rad;p.y=cy+Math.sin(ang)*rad;
    } else if(MODE==='warp'){
      const cx=W/2,cy=H/2;let dx=p.x-cx,dy=p.y-cy;const d=Math.hypot(dx,dy)||1;
      p.x+=dx/d*2.2;p.y+=dy/d*2.2;
      if(d>Math.max(W,H)*0.7){p.x=cx+(Math.random()-0.5)*40;p.y=cy+(Math.random()-0.5)*40;}
    } else {
      p.x+=p.vx;p.y+=p.vy;
      if(p.x<0||p.x>W)p.vx*=-1;if(p.y<0||p.y>H)p.vy*=-1;
    }
    const hue=(HUE0+p.life*40+t*10)%360;
    ctx.beginPath();
    ctx.fillStyle=`hsla(${hue},85%,65%,0.85)`;
    ctx.shadowBlur=12;ctx.shadowColor=`hsla(${hue},90%,60%,0.7)`;
    ctx.arc(p.x,p.y,p.r,0,Math.PI*2);ctx.fill();
  }
  ctx.shadowBlur=0;
  if(MODE==='net'||MODE==='orbit'||MODE==='spiral'){
    for(let i=0;i<n;i++){
      for(let j=i+1;j<n;j++){
        const dx=pts[i].x-pts[j].x,dy=pts[i].y-pts[j].y;
        const d=Math.hypot(dx,dy);
        if(d<130){
          ctx.strokeStyle=`hsla(${HUE0},70%,60%,${(1-d/130)*0.28})`;
          ctx.lineWidth=1;ctx.beginPath();
          ctx.moveTo(pts[i].x,pts[i].y);ctx.lineTo(pts[j].x,pts[j].y);ctx.stroke();
        }
      }
    }
  }
  requestAnimationFrame(draw);
}
addEventListener('resize',resize);resize();draw();

</script></body></html>
